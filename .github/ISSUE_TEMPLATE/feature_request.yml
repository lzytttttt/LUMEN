name: 功能需求
description: 提一个可验证的产品或工程需求（用法提问请去 Discussions，Bug 请用 Bug 报告）
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        **先对齐边界**：LUMEN 是纯前端工作台——没有后端、没有遥测、不加载外链字体，数据只在本地 IndexedDB，
        模型端点由使用者自己填。与这三条前提冲突的需求，请先说明怎么在不引入服务端的前提下落地。

        也请先看一眼 [CONTRIBUTING.md](https://github.com/lzytttttt/LUMEN/blob/main/CONTRIBUTING.md) 的「工程契约」一节：
        数据契约唯一、舞台 1600×900、不加运行时依赖、不加载外链资源这几条是不可改的技术事实。

  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 谁在什么情况下会用到它；现在卡在哪一步、用什么办法绕过、绕过的代价是什么
      placeholder: |
        我在做 3–5 分钟的评审汇报，9 幕够用但需要按评审意见逐幕微调语气……
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你希望的方案
      description: 描述用户能看到的行为（入口在哪、点了发生什么、失败了怎么提示），不必先写实现
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 你试过或考虑过的其它做法，以及它们为什么不够好
    validations:
      required: false

  - type: checkboxes
    id: surface
    attributes:
      label: 影响面（按你判断，可多选）
      options:
        - label: 契约层 — src/schema、src/state（数据契约、store action）
        - label: 渲染 — src/render、src/lint
        - label: 编辑器 — 画布交互、幕栏、检查器、工具栏
        - label: AI 与造幕台 — src/ai、src/forge
        - label: 工作室 — src/studio（SVG / 3D）
        - label: 播放与导出 — src/play、src/export、播放器内核
        - label: 文案与 i18n — zh / en 两组键
        - label: 文档、脚本与测试
        - label: 不确定，需要维护者判断

  - type: textarea
    id: impact
    attributes:
      label: 兼容与代价
      description: 会不会改动 deck 字段或既有导出物、会不会影响已导出的独立 HTML、是否新增运行时依赖、性能与体积上的代价
    validations:
      required: false

  - type: textarea
    id: acceptance
    attributes:
      label: 怎么算做完了
      description: 可验证的验收点：跑哪条命令、看到什么、导出的 HTML 在 file:// 下是否仍可播（pnpm typecheck / test / lint:i18n / build / e2e 里挑相关的写）
    validations:
      required: false

  - type: checkboxes
    id: contract
    attributes:
      label: 工程契约确认
      options:
        - label: 我理解成稿路径必须是 src/state/ops.ts，组件不直接改 deck 对象
          required: true
        - label: 我理解新增界面文案需要 zh / en 同时补齐，由 pnpm lint:i18n 把关
          required: true
        - label: 新增运行时依赖需要先与维护者对齐（当前策略是原则上不加）
          required: true
        - label: 我愿意自己提 PR 实现这个需求
          required: false
