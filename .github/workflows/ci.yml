name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 只读权限：CI 不写仓库、不发 Release，构建产物走 artifact。
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '11'
  CI: 'true'

jobs:
  verify:
    name: 类型检查 · 单元测试 · 构建
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Unit tests (includes i18n key parity)
        run: pnpm test

      - name: Typecheck
        run: pnpm typecheck

      - name: Build player kernel
        run: pnpm build:player

      - name: Build app
        run: pnpm build

      - name: Check build output
        run: |
          set -e
          test -f dist/index.html
          test -f dist/portal.html
          test -f dist/player/lumen-player.js
          test -f dist/player/lumen-player.css
          test -f dist/asset-manifest.json
          test -f dist/manifest.webmanifest
          test -f dist/sw.js
          du -sh dist
          ls dist/assets | head -20

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist
          retention-days: 7

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: verify
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # playwright.config.ts 使用 channel: 'chrome'，所以装品牌 Chrome 而不是 chromium。
      - name: Install Chrome for Playwright
        run: pnpm exec playwright install --with-deps chrome

      - name: E2E
        run: pnpm e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.sha }}
          path: |
            harness/out/playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
