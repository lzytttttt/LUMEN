<!doctype html>
<html lang="zh-CN" data-forge-tier="l3">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>LUMEN · 造幕台 样张</title>
<!--
  plan/v0.2.0/mock/forge.html —— 造幕台静态样张（零依赖、无外部请求、双击即开）
  · 不是产品代码：不复用 src/**，不跑真模型；只验证 04-动效与流程可视化.md 的节奏与降级
  · 9 幕的块 enter / enterDelayMs 按 src/ai/recipes.ts 的配方几何与错峰值（70/60ms）录成静态数据
  · L3 台面用 CSS perspective 模拟，不加载 three
  · 交互钩子：data-fx="stage|action|tier|audio|autoplay|premiere"
  · 舞台态：data-forge="seed|deal|cast|assemble|gate|premiere"（见 02 §4.4）
-->
<style>
/* ============================ 令牌（= src/styles/tokens.css） ============================ */
:root{
  color-scheme:dark;
  --ui-bg:#0a0b0e; --ui-bg-2:#0e1014; --ui-panel:#12141a; --ui-panel-2:#171a21;
  --ui-elev:#1c2029; --ui-hover:#222732; --ui-line:#23262f; --ui-line-strong:#343948;
  --ui-fg:#e8eaef; --ui-fg-dim:#a4aab8; --ui-fg-mute:#737a8a;
  --ui-accent:#c8a15a; --ui-accent-2:#57e3c2;
  --ui-accent-soft:rgba(200,161,90,.14); --ui-accent-line:rgba(200,161,90,.34);
  --ui-danger:#e4574f; --ui-danger-soft:rgba(228,87,79,.14);
  --ui-font:system-ui,-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif;
  --ui-font-mono:ui-monospace,'SF Mono','Cascadia Mono',Consolas,monospace;
  --ease:cubic-bezier(.32,.72,0,1);

  /* 04 §1 —— 动效阶梯：复用 --ease/--dur 体系，只补 220 与 520 */
  --fx-d1:8px; --fx-d2:16px; --fx-d3:32px; --fx-d4:64px;
  --fx-t1:120ms; --fx-t2:220ms; --fx-t3:320ms; --fx-t4:520ms; --fx-t4x:560ms;
  --fx-ease:var(--ease);
  --fx-ease-in:cubic-bezier(.4,0,1,1);
  --fx-ease-settle:cubic-bezier(.22,1,.36,1);
  --fx-ease-pop:cubic-bezier(.34,1.42,.64,1);
  --fx-blur-1:6px; --fx-blur-2:12px;
  --fx-dim:.82; --fx-lit:1.06;
  --fx-glow:0 0 0 1px var(--ui-accent-line),0 8px 32px rgba(200,161,90,.16);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:#07080b;color:var(--ui-fg);font-family:var(--ui-font);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font-family:inherit;border:0;background:none;color:inherit;cursor:pointer}
.viewport{position:fixed;inset:0;display:grid;place-items:center}
.frame{
  position:relative;width:1600px;height:900px;flex:0 0 auto;
  transform:scale(var(--s,1));transform-origin:center center;
  background:var(--ui-bg);overflow:hidden;overflow:clip;isolation:isolate;
}

/* ============================ 背景 ============================ */
.bg{
  position:absolute;inset:0;
  background:
    radial-gradient(120% 66% at 50% -12%, rgba(200,161,90,.12), transparent 62%),
    radial-gradient(88% 52% at 50% 112%, rgba(87,227,194,.05), transparent 64%),
    linear-gradient(180deg,#0a0b0e,#08090c 62%,#0a0b0e);
}
.vignette{position:absolute;inset:0;background:radial-gradient(74% 60% at 50% 44%,transparent 40%,rgba(0,0,0,.62) 100%)}
.floorwrap{position:absolute;inset:0;perspective:820px;perspective-origin:50% 64%;pointer-events:none}
.floor{
  position:absolute;left:50%;bottom:-26%;width:2800px;height:1200px;margin-left:-1400px;
  transform:rotateX(74deg);transform-origin:50% 100%;
  background-image:
    linear-gradient(rgba(200,161,90,.09) 1px,transparent 1px),
    linear-gradient(90deg,rgba(200,161,90,.09) 1px,transparent 1px);
  background-size:140px 140px;
  -webkit-mask-image:radial-gradient(56% 62% at 50% 96%,#000 10%,transparent 74%);
  mask-image:radial-gradient(56% 62% at 50% 96%,#000 10%,transparent 74%);
  opacity:.6;
}
.beam{
  position:absolute;left:50%;top:-10%;width:900px;height:560px;margin-left:-450px;pointer-events:none;
  background:linear-gradient(180deg,rgba(200,161,90,.11),transparent 74%);
  clip-path:polygon(40% 0,60% 0,88% 100%,12% 100%);
  filter:blur(28px);opacity:.42;transition:opacity var(--fx-t4) var(--fx-ease);
}

/* ============================ 顶栏 ============================ */
.top{position:absolute;left:64px;right:64px;top:44px;z-index:130;display:flex;align-items:center;justify-content:space-between}
.mark{font-size:12px;letter-spacing:.36em;color:rgba(232,234,239,.42);transition:opacity var(--fx-t3) var(--fx-ease)}
.mark b{color:var(--ui-accent);font-weight:500}
.railwrap{position:absolute;left:50%;top:0;transform:translateX(-50%);text-align:center}
.rail{display:flex;gap:10px;align-items:center;justify-content:center;height:14px}
.tick{
  width:26px;height:2px;border-radius:2px;background:var(--ui-line-strong);padding:0;cursor:pointer;
  transition:background var(--fx-t2) var(--fx-ease),width var(--fx-t2) var(--fx-ease),box-shadow var(--fx-t2) var(--fx-ease);
}
.tick:hover{background:var(--ui-fg-mute)}
.tick[data-on="1"]{width:44px;background:var(--ui-accent);box-shadow:0 0 18px rgba(200,161,90,.55)}
.tick[data-done="1"]{background:rgba(200,161,90,.45)}
.now{margin-top:11px;font-size:13px;letter-spacing:.34em;color:var(--ui-fg-mute);white-space:nowrap;transition:color var(--fx-t2) var(--fx-ease)}
.now[data-busy="1"]{color:var(--ui-accent)}

/* ============================ 起念 ============================ */
.seed{position:absolute;left:0;right:0;top:352px;display:flex;justify-content:center;opacity:0;transition:opacity var(--fx-t3) var(--fx-ease)}
.seed.on{opacity:1}
.seed input{
  width:1020px;height:72px;text-align:center;font-size:34px;font-weight:400;letter-spacing:.01em;
  color:var(--ui-fg);background:transparent;border:0;border-bottom:1px solid var(--ui-line);
  outline:none;font-family:inherit;
  transition:border-color var(--fx-t3) var(--fx-ease),color var(--fx-t3) var(--fx-ease),opacity var(--fx-t2) linear;
}
.seed input:focus{border-bottom-color:var(--ui-accent-line)}
.seed input.locked{border-bottom-color:transparent;color:var(--ui-fg-dim)}
.seed input.locked:focus{border-bottom-color:transparent}
.caret{position:absolute;left:50%;top:20px;width:2px;height:34px;margin-left:-2px;border-radius:1px;background:var(--ui-accent);opacity:0;pointer-events:none}
.seed.focus .caret{animation:caret 2400ms ease-in-out infinite}
@keyframes caret{0%,100%{opacity:.28}50%{opacity:1}}

/* ============================ 抽幕 ============================ */
.deal{position:absolute;inset:0;display:grid;place-items:center;opacity:0;pointer-events:none;transition:opacity var(--fx-t3) var(--fx-ease)}
.deal.on{opacity:1}
/* 竖版幕卡 168×224：缩略 148×81 + 卡名（≤4 字）+ 序号（03 §2.2） */
.cardgrid{
  display:grid;grid-template-columns:repeat(4,168px);grid-auto-rows:224px;gap:14px;
  transform:scale(.94);transform-style:preserve-3d;
}
.card{
  position:relative;width:168px;height:224px;perspective:720px;
  transform:translate3d(0,280px,0) rotate(-10deg) scale(.86);opacity:0;filter:blur(var(--fx-blur-1));
  will-change:transform,opacity,filter;
}
.card.in{
  transform:none;opacity:1;filter:blur(0);
  transition:transform var(--fx-t4x) var(--fx-ease-settle),opacity 420ms var(--fx-ease),filter var(--fx-t4x) var(--fx-ease-settle);
}
.card .inner{position:absolute;inset:0;transform-style:preserve-3d;transition:transform var(--fx-t2) var(--fx-ease-pop)}
.card.flip .inner{transform:rotateY(180deg)}
.face,.back{position:absolute;inset:0;border-radius:10px;backface-visibility:hidden;overflow:hidden}
.back{
  border:1px solid var(--ui-line);display:grid;place-items:center;
  background:repeating-linear-gradient(58deg,rgba(255,255,255,.045) 0 1px,transparent 1px 11px),linear-gradient(150deg,#171a21,#0d0f14);
}
.back i{display:block;width:6px;height:6px;border-radius:50%;background:rgba(200,161,90,.5);box-shadow:0 0 12px rgba(200,161,90,.7)}
.face{
  transform:rotateY(180deg);padding:10px;display:flex;flex-direction:column;gap:9px;
  border:1px solid var(--ui-line-strong);background:linear-gradient(180deg,#15181f,#101319);
}
.thumb{position:relative;width:148px;height:81px;border-radius:7px;overflow:hidden;background:#0d0f14;border:1px solid #1e222b}
.card.rare .thumb{border-color:rgba(87,227,194,.28)}
.card.lock .face{border-color:var(--ui-accent-line)}
.nm{font-size:13px;letter-spacing:.1em;color:var(--ui-fg);line-height:1}
.no{
  position:absolute;right:11px;top:11px;font-family:var(--ui-font-mono);font-size:9.5px;
  letter-spacing:.08em;color:var(--ui-fg-mute);
}
.tt{display:flex;flex-direction:column;gap:6px;margin-top:auto}
.tt i{display:block;height:6px;border-radius:2px;background:#272d3a}
.tt i:last-child{width:66%}
.face .corner{position:absolute;width:13px;height:13px;opacity:0;transition:opacity var(--fx-t3) var(--fx-ease)}
.face .corner.tl{left:8px;top:8px;border-left:1px solid var(--ui-accent);border-top:1px solid var(--ui-accent)}
.face .corner.br{right:8px;bottom:8px;border-right:1px solid var(--ui-accent);border-bottom:1px solid var(--ui-accent)}
.card.lock .face .corner{opacity:1}
.face .sheen{position:absolute;inset:-40%;opacity:0;pointer-events:none;background:linear-gradient(112deg,transparent 42%,rgba(255,255,255,.16) 50%,transparent 58%)}
.card.gold .face .sheen{background:linear-gradient(112deg,transparent 40%,rgba(200,161,90,.42) 50%,transparent 60%)}
.card.cyan .face .sheen{background:linear-gradient(112deg,transparent 40%,rgba(87,227,194,.34) 50%,transparent 60%)}
.card.sheen .face .sheen{animation:sheen var(--fx-t4) var(--fx-ease) 1}
@keyframes sheen{0%{opacity:0;transform:translateX(-72%)}28%{opacity:1}100%{opacity:0;transform:translateX(72%)}}
.gl{position:relative;width:148px;height:71px}
.gl i{position:absolute;display:block;border-radius:2px}
.gl .h{background:linear-gradient(90deg,#e8eaef,#b9bec9)}
.gl .b{background:#3a4151}
.gl .r{background:var(--ui-accent)}
.gl .p{background:rgba(255,255,255,.035);border:1px solid #2b3140;border-radius:4px}
.gl .d{background:var(--ui-accent);border-radius:50%}
.gl .o{border:0;border-radius:50%;background:conic-gradient(from -90deg,var(--ui-accent) 0 28%,var(--ui-accent-2) 28% 62%,#3a4151 62% 100%);-webkit-mask:radial-gradient(circle,transparent 56%,#000 57%);mask:radial-gradient(circle,transparent 56%,#000 57%)}
/* 大纲态：动作行让到卡阵下方，Pulse 暂隐（此段管线已停） */
[data-forge="deal"] .actrow{top:792px}
[data-forge="deal"] .pulse{opacity:0}

/* ============================ 一张幕的缩放容器 ============================ */
.stagewrap{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity var(--fx-t3) var(--fx-ease);perspective:1600px;perspective-origin:50% 52%}
.stagewrap.on{opacity:1}
.rig{position:absolute;inset:0;transform-style:preserve-3d}
.sx{
  position:absolute;left:50%;top:50%;
  width:calc(1600px * var(--k));height:calc(900px * var(--k));
  margin-left:calc(-800px * var(--k));margin-top:calc(-450px * var(--k));
  border-radius:calc(12px * var(--k) + 3px);overflow:hidden;background:#12141a;
  border:1px solid var(--ui-line);box-shadow:0 34px 100px rgba(0,0,0,.6);
  transform:translate3d(var(--tx,0px),var(--ty,0px),var(--tz,0px)) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) scale(var(--sc,1));
  transform-style:preserve-3d;will-change:transform,opacity;
  transition:transform 420ms var(--fx-ease-settle),opacity var(--fx-t4) var(--fx-ease),box-shadow var(--fx-t3) var(--fx-ease);
}
.sx-in{position:absolute;left:0;top:0;width:1600px;height:900px;transform:scale(var(--k));transform-origin:top left;background:#0f1116}
/* 幕内的块骨架（k-h 标题 / k-b 正文 / k-r 金线 / k-p 面板 / k-d 点 / k-o 环） */
.b{position:absolute;border-radius:3px;background:#2a3040}
.b.k-h{background:linear-gradient(90deg,#dfe3ea,#aeb4c1);border-radius:4px}
.b.k-b{background:#343b4b}
.b.k-r{background:var(--ui-accent);border-radius:2px}
.b.k-p{background:rgba(255,255,255,.026);border:1px solid #23262f;border-radius:8px}
.b.k-d{background:var(--ui-accent);border-radius:50%;box-shadow:0 0 16px rgba(200,161,90,.5)}
.b.k-o{border:0;border-radius:50%;background:conic-gradient(from -90deg,var(--ui-accent) 0 22%,var(--ui-accent-2) 22% 48%,#39404f 48% 100%);-webkit-mask:radial-gradient(circle,transparent 60%,#000 61%);mask:radial-gradient(circle,transparent 60%,#000 61%)}
@keyframes enterFade{from{opacity:0}}
@keyframes enterRise{from{opacity:0;transform:translateY(18px)}}
@keyframes enterScale{from{opacity:0;transform:scale(.97)}}
.hero-slot,.stack-l,.casting{position:absolute;inset:0;transform-style:preserve-3d}
.sx.front{box-shadow:0 50px 140px rgba(0,0,0,.7),0 0 0 1px rgba(200,161,90,.2),0 0 130px rgba(200,161,90,.1)}
.casting{opacity:0;transition:opacity var(--fx-t3) var(--fx-ease)}
.casting.on{opacity:1}
.casting .sx{opacity:.3;border-color:var(--ui-accent-line)}

/* 落位闷响环 */
.ping{
  position:absolute;left:50%;top:50%;width:800px;height:450px;margin:-225px 0 0 -400px;z-index:150;
  border:1px solid rgba(200,161,90,.5);border-radius:50%;opacity:0;pointer-events:none;
}
.ping.go{animation:ping var(--fx-t3) var(--fx-ease-settle)}
@keyframes ping{0%{opacity:.45;transform:scale(.64)}100%{opacity:0;transform:scale(2.05)}}

/* 过检：门（贯穿舞台的两道 1px 竖线） */
.door{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity var(--fx-t3) var(--fx-ease);z-index:120}
.door.on{opacity:1}
.door i{position:absolute;top:104px;bottom:52px;left:50%;width:1px;
  background:linear-gradient(180deg,transparent,var(--ui-accent) 4%,var(--ui-accent) 96%,transparent);
  box-shadow:0 0 16px rgba(200,161,90,.4);transition:background var(--fx-t1) linear}
.door i.d1{transform:translateX(-80px)}
.door i.d2{transform:translateX(80px)}
.door.err i{background:linear-gradient(180deg,transparent,var(--ui-danger) 3%,var(--ui-danger) 97%,transparent);box-shadow:0 0 20px rgba(228,87,79,.55)}

/* 过检：径向金色短线（爆开的一帧） */
.burst{position:absolute;left:50%;top:50%;width:0;height:0;z-index:200;pointer-events:none;opacity:0;transition:opacity var(--fx-t2) linear}
.burst.on{opacity:1}
.burst i{
  position:absolute;width:1px;height:var(--len);border-radius:1px;transform-origin:50% 100%;
  background:linear-gradient(to top,rgba(200,161,90,.9),rgba(200,161,90,0));
  transform:rotate(var(--a));opacity:var(--o);
}
.badge{position:absolute;right:24px;top:24px;width:12px;height:12px;background:var(--ui-danger);border-radius:0;opacity:0;transform:scale(0);
  transition:opacity var(--fx-t2) var(--fx-ease),transform var(--fx-t2) var(--fx-ease-pop)}
.badge.on{opacity:1;transform:scale(1)}
.star{position:absolute;right:26px;top:26px;width:14px;height:14px;background:var(--ui-accent);opacity:0;transform:scale(0);
  clip-path:polygon(50% 0,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0 50%,39% 39%);
  transition:opacity var(--fx-t2) var(--fx-ease),transform var(--fx-t2) var(--fx-ease-pop)}
.star.on{opacity:.9;transform:scale(1)}
.sweep{position:absolute;inset:0;pointer-events:none;opacity:0;background:linear-gradient(100deg,transparent 38%,rgba(200,161,90,.18) 50%,transparent 62%)}
.sweep.go{animation:sweep var(--fx-t4) var(--fx-ease)}
@keyframes sweep{0%{opacity:0;clip-path:inset(0 100% 0 0)}20%{opacity:1}100%{opacity:0;clip-path:inset(0)}}

/* ============================ 开演：弧线 ============================ */
.arc{position:absolute;inset:0;perspective:1200px;perspective-origin:50% 46%;opacity:0;pointer-events:none;transition:opacity var(--fx-t4) var(--fx-ease);transform-style:preserve-3d}
.arc.on{opacity:1}
.arc .sx{box-shadow:0 22px 60px rgba(0,0,0,.66)}
.arcveil{
  position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity var(--fx-t4) var(--fx-ease);
  background:radial-gradient(36% 29% at 50% 45%,transparent 0,rgba(0,0,0,.42) 62%,rgba(0,0,0,.86) 100%);
}
.arcveil.on{opacity:1}
.prembtn{
  position:absolute;left:50%;top:598px;transform:translateX(-50%);height:50px;padding:0 42px;border-radius:25px;
  background:var(--ui-accent);color:#0b0c10;font-size:15px;font-weight:600;letter-spacing:.32em;text-indent:.32em;
  box-shadow:0 18px 54px rgba(200,161,90,.26);z-index:60;
  opacity:0;pointer-events:none;transition:opacity var(--fx-t3) var(--fx-ease),transform var(--fx-t2) var(--fx-ease-pop);
}
.prembtn.on{opacity:1;pointer-events:auto}
.prembtn:hover{transform:translateX(-50%) scale(1.03)}
.premback{
  position:absolute;left:50%;top:664px;transform:translateX(-50%);z-index:60;
  font-size:11px;letter-spacing:.26em;color:rgba(232,234,239,.26);
  opacity:0;pointer-events:none;transition:opacity var(--fx-t3) var(--fx-ease);
}
.premback.on{opacity:1;pointer-events:auto}
.premback:hover{color:rgba(232,234,239,.5)}

/* ============================ HUD / 动作行 / 数值 ============================ */
.hud{position:absolute;right:64px;top:96px;text-align:right;z-index:46;opacity:0;pointer-events:none;
  transition:opacity var(--fx-t3) var(--fx-ease);font-variant-numeric:tabular-nums}
.hud.on{opacity:1}
.hud b{display:block;font-family:var(--ui-font-mono);font-size:22px;font-weight:400;letter-spacing:.06em;color:var(--ui-fg)}
.hud span{display:block;margin-top:4px;font-family:var(--ui-font-mono);font-size:12px;letter-spacing:.14em;color:var(--ui-accent)}

.actrow{position:absolute;left:50%;top:742px;transform:translateX(-50%);display:flex;align-items:center;gap:22px;z-index:30}
.action{
  height:44px;padding:0 30px;border-radius:22px;backdrop-filter:blur(6px);
  border:1px solid var(--ui-line-strong);background:rgba(18,20,26,.72);
  color:var(--ui-fg);font-size:14px;letter-spacing:.22em;text-indent:.22em;
  transition:border-color var(--fx-t2) var(--fx-ease),background var(--fx-t2) var(--fx-ease),color var(--fx-t2) var(--fx-ease),opacity var(--fx-t2) var(--fx-ease),transform var(--fx-t2) var(--fx-ease-pop);
}
.action:hover{border-color:var(--ui-accent-line);background:rgba(28,32,41,.85);color:#fff}
.action:active{transform:scale(.97)}
.action[data-primary="1"]{border-color:var(--ui-accent-line);color:var(--ui-accent)}
.action[data-primary="1"]:hover{background:var(--ui-accent-soft);color:#e8d5ac}
.action[data-hidden="1"]{opacity:0;pointer-events:none;transform:translateY(8px)}
.ctr,.combo{display:none}
.ctr{font-family:var(--ui-font-mono);font-size:13px;letter-spacing:.12em;color:var(--ui-fg-mute);font-variant-numeric:tabular-nums;min-width:52px}
.combo{position:relative;width:74px;height:24px}
.plus{position:absolute;right:0;top:0;font-family:var(--ui-font-mono);font-size:13px;color:var(--ui-accent-2);opacity:0;pointer-events:none}
.plus.go{animation:plus var(--fx-t4) var(--fx-ease) both}
@keyframes plus{0%{opacity:0;transform:translateY(0)}18%{opacity:1}100%{opacity:0;transform:translateY(-32px)}}

/* ============================ 脉冲 Pulse ============================ */
.pulse{position:absolute;left:50%;bottom:52px;transform:translateX(-50%);display:flex;align-items:flex-end;gap:6px;height:22px;z-index:36}
.pulse i{
  display:block;width:3px;height:6px;border-radius:2px;background:var(--ui-line);opacity:.85;
  transition:height var(--fx-t2) var(--fx-ease),background var(--fx-t2) var(--fx-ease),opacity var(--fx-t2) linear,box-shadow var(--fx-t2) var(--fx-ease);
}
.pulse i.done{background:rgba(87,227,194,.55);height:8px;opacity:.75}
.pulse i.now{background:var(--ui-accent);height:20px;box-shadow:0 0 14px rgba(200,161,90,.6);opacity:1}
/* "过检"那一段的红色缺口（04 §5） */
.pulse i.bad{background:linear-gradient(90deg,var(--ui-danger) 0 36%,transparent 36% 64%,var(--ui-danger) 64% 100%);height:9px;opacity:1;box-shadow:none}

/* ============================ 角落控制台 ============================ */
.dock{position:absolute;left:64px;right:64px;bottom:32px;display:flex;justify-content:space-between;align-items:center;z-index:38}
.dockl,.dockr{display:flex;align-items:center;gap:12px}
.chip{
  height:26px;padding:0 11px;border-radius:13px;border:1px solid var(--ui-line);

  color:var(--ui-fg-mute);transition:color var(--fx-t2) var(--fx-ease),border-color var(--fx-t2) var(--fx-ease);
}
.chip:hover{color:var(--ui-fg);border-color:var(--ui-line-strong)}
.chip[data-t="l3"]{color:var(--ui-accent);border-color:var(--ui-accent-line)}
.chip[data-t="l1"]{color:var(--ui-accent-2);border-color:rgba(87,227,194,.34)}
.ico{width:28px;height:28px;border-radius:8px;border:1px solid transparent;display:grid;place-items:center;color:var(--ui-fg-mute);transition:color var(--fx-t2) var(--fx-ease),background var(--fx-t2) var(--fx-ease),border-color var(--fx-t2) var(--fx-ease)}
.ico:hover{background:rgba(34,39,50,.7);color:var(--ui-fg)}
.ico[data-on="1"]{color:var(--ui-accent);border-color:var(--ui-accent-line)}
.ico svg{display:block}

/* ============================ 开演（全屏） ============================ */
.prem{position:absolute;inset:0;z-index:80;background:#000;display:none;place-items:center;overflow:hidden}
.prem.on{display:grid}
.prem .pslide{width:1600px;height:900px;position:relative;overflow:hidden;background:#0b0c10}
.pager{position:absolute;left:50%;bottom:40px;transform:translateX(-50%);font-family:var(--ui-font-mono);font-size:12px;letter-spacing:.2em;color:rgba(255,255,255,.28)}

/* ============================ 降级：L1 / L0 / 减少动效 ============================ */
[data-forge-tier="l1"] .stagewrap{perspective:none}
[data-forge-tier="l1"] .sx{filter:none!important}
[data-forge-tier="l1"] .floor{opacity:.34}
[data-forge-tier="l1"] .beam{display:none}

[data-forge-tier="l0"] .stagewrap{perspective:none}

[data-forge-tier="l0"] .card{transition:none!important}
[data-forge-tier="l0"] *{animation-duration:1ms!important;animation-delay:0ms!important;transition-duration:1ms!important}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:120ms!important;animation-delay:0ms!important;transition-duration:120ms!important}
  .beam{display:none}
  .card{filter:none!important}
}

<script>
(() => {
'use strict'

/* =============== 0. 缩放 =============== */
const frame = document.getElementById('frame')
const fit = () => frame.style.setProperty('--s', Math.min(innerWidth / 1600, innerHeight / 900).toFixed(4))
addEventListener('resize', fit); fit()

const $ = (id) => document.getElementById(id)
const sleep = (ms) => new Promise((r) => setTimeout(r, ms))
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches

/* =============== 1. 配方 → 块（几何与错峰取自 src/ai/recipes.ts） =============== */
const B = (x, y, w, h, k, e, d) => ({ x, y, w, h, k, e: e || 'none', d: d || 0 })

function blocksOf(r) {
  switch (r) {
    case 'cover': return [
      B(120,176,300,12,'b'), B(120,250,860,104,'h'), B(120,388,96,3,'r'),
      B(120,428,620,30,'b'), B(120,780,420,12,'b'), B(860,150,620,600,'p')]
    case 'statement': return [
      B(120,262,1360,112,'h'), B(760,412,80,3,'r'), B(300,462,1000,30,'b'), B(420,536,760,22,'b')]
    case 'grid3': {
      const o = [B(120,136,700,56,'h'), B(120,206,520,16,'b')]
      for (let i = 0; i < 3; i++) {
        const x = 120 + i * 434
        o.push(B(x,330,410,300,'p'),
          B(x+28,362,60,14,'b','rise',i*60), B(x+28,392,300,44,'h','rise',i*60),

      }

    }
    case 'timeline': {
      const o = [B(120,136,700,56,'h'), B(120,206,420,16,'b'), B(120,462,1360,1,'r')]
      for (let i = 0; i < 4; i++) {
        const cx = 120 + (i + .5) * 340
        o.push(B(cx-9,453,18,18,'d','rise',i*70),

    case 'split': return [

    case 'data': {
      const o = [B(120,136,700,56,'h'), B(120,206,520,16,'b'), B(120,290,360,360,'o')]
      for (let i = 0; i < 4; i++) {
        o.push(B(540,334+i*72,14,14,'d','rise',i*60),
          B(566,332+i*72,190,22,'b','rise',i*60),

      }
      o.push(B(1000,300,480,44,'h'), B(1000,368,460,28,'b'), B(1000,404,460,28,'b'),
        B(1000,460,120,1,'r'), B(1000,486,460,16,'b'), B(1000,512,380,16,'b'))
      return o
    }
    case 'compare': {
      const o = [B(120,136,700,56,'h'), B(120,206,520,16,'b'),
        B(120,288,420,40,'h'), B(860,288,420,40,'h'), B(800,262,1,360,'r')]
      for (let i = 0; i < 3; i++) {
        o.push(B(120,374+i*84,620,20,'b','rise',i*60), B(860,374+i*84,600,20,'b','rise',i*60))
      }
      o.push(B(120,700,520,16,'b'))
      return o
    }
    case 'process': {
      const o = [B(120,136,700,56,'h'), B(120,206,460,16,'b')]
      for (let i = 0; i < 3; i++) {
        const x = 120 + i * 459
        o.push(B(x,330,435,220,'p'),
          B(x+24,354,60,14,'b','rise',i*60), B(x+24,384,260,44,'h','rise',i*60),
          B(x+24,444,340,16,'b','rise',i*60), B(x+24,468,300,16,'b','rise',i*60))
      }
      o.push(B(120,600,900,16,'b'))
      return o
    }
    case 'closing': return [
      B(120,268,900,104,'h'), B(120,410,660,30,'b'), B(120,780,420,12,'b'), B(920,150,560,600,'p')]
    case 'quote': return [
      B(200,262,1200,96,'h'), B(760,412,80,3,'r'), B(420,462,760,24,'b')]
    case 'gallery': {
      const o = [B(120,136,700,56,'h'), B(120,206,420,16,'b')]
      for (let i = 0; i < 3; i++) o.push(B(120+i*434,300,410,420,'p'))
      return o
    }
    default: {
      const o = [B(120,136,700,56,'h')]
      for (let i = 0; i < 4; i++) o.push(B(120+i*328,330,304,300,'p'))
      return o

}

/* 12 张卡的 glyph（148×71 内）：只有形态，没有文字 */
const GLYPH = {
  cover:    [[0,8,74,10,'h'],[0,28,40,2,'r'],[0,42,60,4,'b'],[96,4,52,63,'p'],[104,12,36,3,'b'],[104,20,28,3,'b']],
  statement:[[16,26,116,10,'h'],[54,44,40,2,'r'],[28,54,92,3,'b']],
  split:    [[0,6,74,8,'h'],[0,24,64,3,'b'],[0,32,64,3,'b'],[0,40,50,3,'b'],[96,4,52,63,'p'],[104,12,36,3,'b']],
  grid3:    [[0,2,80,6,'h'],[0,26,44,45,'p'],[6,34,20,3,'r'],[6,42,30,4,'b'],[6,50,26,3,'b'],
             [52,26,44,45,'p'],[58,34,20,3,'r'],[58,42,30,4,'b'],[58,50,26,3,'b'],
             [104,26,44,45,'p'],[110,34,20,3,'r'],[110,42,30,4,'b'],[110,50,26,3,'b']],
  grid4:    [[0,2,80,6,'h'],[0,26,34,45,'p'],[5,34,22,3,'b'],[5,42,16,3,'b'],
             [36,26,34,45,'p'],[41,34,22,3,'b'],[41,42,16,3,'b'],
             [72,26,34,45,'p'],[77,34,22,3,'b'],[77,42,16,3,'b'],
             [108,26,34,45,'p'],[113,34,22,3,'b'],[113,42,16,3,'b']],
  timeline: [[0,2,80,6,'h'],[0,40,148,1,'r'],[14,36,7,7,'d'],[52,36,7,7,'d'],[90,36,7,7,'d'],[128,36,7,7,'d'],[10,50,30,3,'b'],[48,50,30,3,'b']],
  compare:  [[0,2,80,6,'h'],[0,26,60,45,'p'],[7,33,34,3,'b'],[7,41,44,3,'b'],[7,49,30,3,'b'],
             [74,26,1,45,'r'],[88,26,60,45,'p'],[95,33,34,3,'b'],[95,41,44,3,'b'],[95,49,30,3,'b']],
  quote:    [[22,26,104,9,'h'],[60,42,28,2,'r'],[18,20,2,42,'b'],[128,20,2,42,'b']],
  data:     [[0,2,80,6,'h'],[6,18,54,54,'o'],[78,20,62,4,'b'],[78,32,50,4,'b'],[78,44,60,4,'b'],[78,56,40,4,'b']],
  process:  [[0,2,80,6,'h'],[0,26,42,45,'p'],[4,31,9,9,'r'],[4,44,30,3,'b'],
             [50,26,42,45,'p'],[54,31,9,9,'r'],[54,44,30,3,'b'],
             [100,26,42,45,'p'],[104,31,9,9,'r'],[104,44,30,3,'b']],
  gallery:  [[0,2,80,6,'h'],[0,22,44,36,'p'],[52,22,44,36,'p'],[104,22,44,36,'p'],[0,62,32,3,'b'],[52,62,32,3,'b'],[104,62,32,3,'b']],
  closing:  [[0,32,90,9,'h'],[0,50,40,2,'r'],[96,4,52,63,'p'],[104,12,36,3,'b'],[104,20,28,3,'b']]
}
const ALL = Object.keys(GLYPH)
const LOCK = new Set(['cover', 'closing'])
const RARE = new Set(['data', 'gallery'])

/* 9 幕 deck；转场取自 compose.ts 的 TRANSITIONS 表 */
const DECK = [
  { r: 'cover',     tr: 'fade'   },
  { r: 'statement', tr: 'fade'   },
  { r: 'data',      tr: 'fade'   },
  { r: 'timeline',  tr: 'push'   },
  { r: 'split',     tr: 'push'   },
  { r: 'grid3',     tr: 'wipe'   },
  { r: 'compare',   tr: 'wipe'   },
  { r: 'process',   tr: 'push'   },
  { r: 'closing',   tr: 'flip3d' }
]
const N = DECK.length

/* =============== 2. 状态 =============== */
const S = { stage: 0, active: -1, combo: 0, busy: false, phase: null, cue: 0 }
const el = {
  seed: $('seed'), line: $('line'), now: $('now'), rail: $('rail'), deal: $('deal'),
  cards: $('cards'), stagewrap: $('stagewrap'), heroSlot: $('heroSlot'), stackL: $('stackL'),
  casting: $('casting'), door: $('door'), burst: $('burst'), ping: $('ping'),
  arcwrap: $('arcwrap'), arc: $('arc'), arcveil: $('arcveil'),
  prembtn: $('prembtn'), premback: $('premback'),
  hud: $('hud'), hudN: $('hudN'), hudC: $('hudC'),
  act: $('act'), actrow: $('actrow'), ctr: $('ctr'), mult: $('mult'), plus: $('plus'),
  pulse: $('pulse'), tier: $('tier'), snd: $('snd'), auto: $('auto'),
  prem: $('prem'), pslide: $('pslide'), pager: $('pager'), mark: $('mark'), beam: $('beam')
}
const ticks = [...el.rail.querySelectorAll('.tick')]
const bars = [...el.pulse.querySelectorAll('i')]

/* =============== 3. 音频：5 类轻音（WebAudio 合成，默认关 D6） =============== */
const Sound = {
  ctx: null, out: null, on: false, last: 0,
  ensure() {
    if (!this.ctx) {
      const C = window.AudioContext || window.webkitAudioContext
      if (!C) return null
      const ctx = new C()
      const comp = ctx.createDynamicsCompressor()
      const master = ctx.createGain()
      master.gain.value = 0.22
      comp.connect(master); master.connect(ctx.destination)
      this.ctx = ctx; this.out = comp
    }
    if (this.ctx.state === 'suspended') this.ctx.resume().catch(() => {})
    return this.ctx
  },
  tone(type, f0, f1, dur, peak) {
    if (!this.on) return
    const now = performance.now()
    if (now - this.last < 55) return
    this.last = now
    const ctx = this.ensure(); if (!ctx) return
    const t = ctx.currentTime
    const o = ctx.createOscillator(), g = ctx.createGain()
    o.type = type
    o.frequency.setValueAtTime(f0, t)
    o.frequency.exponentialRampToValueAtTime(Math.max(40, f1), t + dur / 1000)
    g.gain.setValueAtTime(0.0001, t)
    g.gain.exponentialRampToValueAtTime(peak, t + 0.004)
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur / 1000)
    o.connect(g); g.connect(this.out)
    o.start(t); o.stop(t + dur / 1000 + 0.02)
    o.onended = () => { try { o.disconnect(); g.disconnect() } catch (_) {} }
  },
  deal() { this.tone('triangle', 520, 660, 90, 0.10) },
  land() { this.tone('sine', 132, 98, 120, 0.13) },
  gate(ok) {
    if (ok) { this.tone('sine', 880, 880, 70, 0.07); setTimeout(() => this.tone('sine', 1320, 1320, 90, 0.06), 70) }
    else { this.tone('square', 220, 180, 70, 0.05); setTimeout(() => this.tone('square', 196, 160, 70, 0.05), 90) }
  },
  combo(n) { const f = 660 * Math.pow(2, Math.min(n, 12) / 12); this.tone('sine', f, f, 60, 0.05) },
  premiere() { [523, 659, 784].forEach((f, i) => setTimeout(() => this.tone('sine', f, f, 240, 0.07), i * 70)) }
}
el.snd.addEventListener('click', () => {
  Sound.on = !Sound.on
  el.snd.dataset.on = Sound.on ? '1' : '0'
  el.snd.querySelector('.wave1').setAttribute('opacity', Sound.on ? '1' : '0')
  if (Sound.on) { Sound.ensure(); Sound.combo(4) }
})

/* =============== 4. 阶段 / Pulse =============== */
/* 名词规范化：输入 / 大纲 / 生成 / 检查 / 播放（内部代号 seed/deal/cast/gate/premiere 不变） */
const STAGES = ['输入', '大纲', '生成', '检查', '播放']
const FORGE = ['seed', 'deal', 'cast', 'gate', 'premiere']
function setStage(n) {
  S.stage = n
  frame.dataset.forge = FORGE[n]
  el.now.textContent = STAGES[n]
  ticks.forEach((t, i) => { t.dataset.on = i === n ? '1' : '0'; t.dataset.done = i < n ? '1' : '0' })
  el.mark.style.opacity = n === 0 ? '1' : '0'
  el.seed.classList.toggle('on', n === 0)
  el.deal.classList.toggle('on', n === 1)
  el.now.dataset.busy = n === 0 ? '0' : '1'
}
/* Pulse 连续化（04 §4）：单一进度量 0→7，由一条 rAF 插值，
   取代"四段硬跳"。每个格子只读 prog，读屏与视觉同步。 */
const PULSE = ['think', 'plan', 'write', 'draw', 'set', 'check', 'seal']
let prog = 0
let progRaf = 0
const easeOutCubic = (t) => 1 - Math.pow(1 - t, 3)
function paintPulse() {
  bars.forEach((b, i) => {
    if (b.classList.contains('bad')) return
    const local = Math.max(0, Math.min(1, prog - i))
    const h = 6 + 14 * local
    b.style.height = h.toFixed(1) + 'px'
    b.style.background = local >= 1 ? 'rgba(87,227,194,.55)' : local > 0.02 ? 'var(--ui-accent)' : 'var(--ui-line)'
    b.style.boxShadow = (local > 0.02 && local < 0.98) ? '0 0 14px rgba(200,161,90,.55)' : 'none'
    b.style.opacity = local > 0.02 ? '1' : '.85'
  })
}
function pulseAt(v, ms = 420, holdMs = 0) {
  const from = prog
  const t0 = performance.now()
  cancelAnimationFrame(progRaf)
  clearTimeout(pulseTimer)
  const step = (t) => {
    const k = ms <= 0 ? 1 : Math.min(1, (t - t0) / ms)
    prog = from + (v - from) * easeOutCubic(k)
    paintPulse()
    if (k < 1) progRaf = requestAnimationFrame(step)
    else if (holdMs) pulseTimer = setTimeout(resetPulse, holdMs)
  }
  progRaf = requestAnimationFrame(step)
}
function resetPulse() {
  cancelAnimationFrame(progRaf)
  prog = 0
  bars.forEach((b) => { b.classList.remove('bad'); b.style = '' })
  paintPulse()
}
/* 「检查」那一段的红缺口：必须清掉 paintPulse 写的行内样式，否则类选择器被行内样式盖掉 */
function markBad() {
  const b = bars[5]
  b.style.cssText = ''
  b.classList.add('bad')
}
let pulseTimer = 0

/* =============== 5. 舞台：9 张幕的缩放容器 =============== */
const nodes = []
const ENTER = {
  fade: 'enterFade 520ms var(--fx-ease) both',
  rise: 'enterRise 560ms var(--fx-ease) both',
  scale: 'enterScale 560ms var(--fx-ease) both'
}
function buildStage() {
  ;[el.heroSlot, el.stackL, el.casting, el.arc].forEach((h) => { h.innerHTML = '' })
  nodes.length = 0
  DECK.forEach((d) => {
    const sx = document.createElement('div')
    sx.className = 'sx'
    const inner = document.createElement('div')
    inner.className = 'sx-in'
    for (const b of blocksOf(d.r)) {
      const n = document.createElement('div')
      n.className = 'b k-' + b.k
      n.style.cssText = `left:${b.x}px;top:${b.y}px;width:${b.w}px;height:${b.h}px`
      n.dataset.e = b.e; n.dataset.d = b.d
      inner.appendChild(n)
    }
    const sweep = document.createElement('div'); sweep.className = 'sweep'
    const badge = document.createElement('div'); badge.className = 'badge'
    const star = document.createElement('div'); star.className = 'star'
    inner.appendChild(sweep); inner.appendChild(badge); inner.appendChild(star)
    sx.appendChild(inner)
    sx.style.opacity = '0'
    nodes.push({ sx, inner, sweep, badge, star, data: d })
  })
}
const setVars = (sx, vars) => { for (const k in vars) sx.style.setProperty('--' + k, vars[k]) }

function mount(node, host, vars) {
  host.appendChild(node.sx)
  setVars(node.sx, vars)
  node.sx.style.opacity = '1'
  node.sx.style.filter = 'none'
}

function playEnter(node, freezeMs) {
  const inner = node.inner
  inner.querySelectorAll('.b[data-e]').forEach((n) => {
    const e = n.dataset.e
    if (!e || e === 'none') return
    n.style.animation = 'none'
    void n.offsetHeight
    n.style.animation = ENTER[e]
    n.style.animationDelay = (Number(n.dataset.d) || 0) + 'ms'
  })
  if (freezeMs == null) return
  requestAnimationFrame(() => {
    inner.querySelectorAll('.b[data-e]').forEach((n) => {
      n.getAnimations().forEach((a) => {
        a.pause()
        try { a.currentTime = freezeMs } catch (_) {}
      })
    })
  })
}

/* T2：台面主景（中心 800×450 + 左侧已完成栈 + 右侧在铸幕） */
function showRig(active) {
  S.active = active
  frame.dataset.forge = 'cast'
  el.stagewrap.classList.add('on')
  el.arcwrap.classList.remove('on')
  el.arc.classList.remove('on'); el.arcveil.classList.remove('on')
  el.door.classList.remove('on', 'err')
  el.burst.classList.remove('on')
  el.prembtn.classList.remove('on'); el.premback.classList.remove('on')
  el.hud.classList.add('on')

  const hero = nodes[active]
  mount(hero, el.heroSlot, { k: '.5', rx: '6deg', ry: '-10deg', tx: '0px', ty: '0px', tz: '0px', sc: '1' })
  hero.sx.classList.add('front')
  /* 落位收尾：10px 的沉降，只叠 translate，不动 transform（避免和景深打架） */
  hero.sx.animate(
    [{ translate: '0 12px' }, { translate: '0 0px' }],
    { duration: reduce ? 120 : 360, easing: 'cubic-bezier(.22,1,.36,1)' }
  )

  /* 左侧已完成栈：最多 5 张，竖向阶梯，越往下越暗 */
  const from = Math.max(0, active - 5)
  let n = 0
  for (let i = active - 1; i >= from; i--, n++) {
    const s = nodes[i]
    mount(s, el.stackL, {
      k: '.1', rx: '0deg', ry: '14deg',
      tx: (-500 - n * 10) + 'px', ty: (-160 + n * 104) + 'px', tz: (-40 * (n + 1)) + 'px', sc: '1'
    })
    s.sx.classList.remove('front')
    s.sx.style.opacity = String((1 - n * 0.13).toFixed(2))
    s.sx.style.filter = `brightness(${(1 - n * 0.12).toFixed(2)})`
  }

  /* 右侧在铸幕：不透明度 30%，右移 120、下沉 24（并发 2） */
  if (active + 1 < N) {
    const c = nodes[active + 1]
    mount(c, el.casting, { k: '.5', rx: '6deg', ry: '-10deg', tx: '120px', ty: '24px', tz: '-120px', sc: '1' })
    c.sx.classList.remove('front')
    c.sx.style.opacity = '.3'
    el.casting.classList.add('on')
  } else el.casting.classList.remove('on')

  nodes.forEach((node, i) => { if (i > active + 1) node.sx.style.opacity = '0' })
  el.hudN.textContent = (active + 1) + '/9'
  el.hudC.textContent = '×' + Math.max(S.combo, 1)
}

/* 过检：幕停在门中间（translateZ 200 / scale .96），门外两道线 */
function showGate(active, err) {
  S.active = active
  frame.dataset.forge = 'gate'
  el.stagewrap.classList.add('on')
  ;[el.stackL, el.casting].forEach((h) => { h.innerHTML = '' })
  el.casting.classList.remove('on')
  el.hud.classList.remove('on')
  el.door.classList.add('on')
  el.door.classList.toggle('err', !!err)
  const hero = nodes[active]
  mount(hero, el.heroSlot, { k: '.5', rx: '0deg', ry: '0deg', tx: '0px', ty: '0px', tz: '200px', sc: '.96' })
  hero.sx.classList.add('front')
  hero.sx.style.filter = err ? 'brightness(.88) saturate(.72)' : 'none'
  hero.badge.classList.toggle('on', !!err)
  hero.star.classList.toggle('on', !err)
  nodes.forEach((node, i) => { if (i !== active) node.sx.style.opacity = '0' })
  bars.forEach((b, i) => b.classList.toggle('bad', !!err && i === 5))
  if (err) burst()
}
function burst() {
  el.burst.innerHTML = ''
  const count = document.documentElement.dataset.tier === 'l3' ? 8 : 6
  const RX = 470, RY = 300            /* 椭圆轨道：贴着 800×450 幕的外沿 */
  for (let i = 0; i < count; i++) {
    const th = (Math.PI * 2 / count) * i + 0.24
    const x = Math.cos(th) * RX
    const y = Math.sin(th) * RY
    const len = 12 + (i % 3) * 6
    const sp = document.createElement('i')
    sp.style.left = (x - 0.5).toFixed(1) + 'px'
    sp.style.top = (y - len).toFixed(1) + 'px'
    sp.style.setProperty('--len', len + 'px')
    sp.style.setProperty('--a', (th * 180 / Math.PI + 90).toFixed(1) + 'deg')
    sp.style.setProperty('--o', (1 - (i % 3) * 0.16).toFixed(2))
    el.burst.appendChild(sp)
  }
  el.burst.classList.add('on')
}

/* T3：开演前的弧线完成态 */
function showArc() {
  frame.dataset.forge = 'premiere'
  el.stagewrap.classList.remove('on')
  el.hud.classList.remove('on')
  el.door.classList.remove('on', 'err')
  el.burst.classList.remove('on')
  ;[el.heroSlot, el.stackL, el.casting].forEach((h) => { h.innerHTML = '' })
  el.arcwrap.classList.add('on')
  el.arc.classList.add('on')
  el.arcveil.classList.add('on')
  nodes.forEach((node, i) => {
    const t = (i - (N - 1) / 2) / ((N - 1) / 2)          /* -1 … 1 */
    const ry = (-18 * t).toFixed(2) + 'deg'               /* 左 +18° → 右 -18° */
    const x = t * 602
    const y = -46 + (1 - Math.cos(t * 1.15)) * 58         /* 整排高于视觉中心 */
    mount(node, el.arc, {
      k: '.1', rx: '0deg', ry,
      tx: x.toFixed(1) + 'px', ty: y.toFixed(1) + 'px',
      tz: (-Math.abs(t) * 70).toFixed(1) + 'px', sc: '1'
    })
    node.sx.classList.remove('front')
    node.badge.classList.remove('on')
    /* 错峰落位：用独立的 translate 属性叠加，不与 --k/--ry 的 transform 抢值 */
    node.sx.animate(
      [{ translate: '0 34px' }, { translate: '0 0px' }],
      { duration: reduce ? 120 : 460, delay: reduce ? 0 : i * 26, easing: 'cubic-bezier(.22,1,.36,1)', fill: 'backwards' }
    )
    const bright = 1 - 0.42 * Math.pow(Math.abs(t), 1.2)
    node.sx.style.filter = `brightness(${bright.toFixed(2)})`
    node.sx.style.opacity = String((0.62 + 0.38 * bright).toFixed(2))
  })
  el.prembtn.classList.add('on')
  el.premback.classList.add('on')
  el.act.dataset.hidden = '1'
  bars.forEach((b) => b.classList.remove('bad', 'now', 'done'))
}

/* =============== 6. 抽幕 =============== */
/* 卡名（≤4 字）照 03 §2.2 的权威表，不另起词 */
const CARD_NAME = {

/* 发牌：WAAPI 单条时间线（不再用 class+transition 的二次帧），
   55ms 错峰 + 40% 处轻微过冲；翻面与光泽挂在同一条时间线上，避免相互等待 */
const DEAL_KF = [
  { transform: 'translate3d(0,280px,0) rotate(-10deg) scale(.86)', opacity: 0, filter: 'blur(6px)', offset: 0 },
  { transform: 'translate3d(0,-10px,0) rotate(0deg) scale(1.02)', opacity: 1, filter: 'blur(0)', offset: .42 },
  { transform: 'translate3d(0,0,0) rotate(0deg) scale(1)', opacity: 1, filter: 'blur(0)', offset: 1 }
]
const FLIP_KF = [{ transform: 'rotateY(0deg)' }, { transform: 'rotateY(180deg)' }]
const SHEEN_KF = [
  { opacity: 0, transform: 'translateX(-72%)' },
  { opacity: 1, transform: 'translateX(0%)', offset: .3 },
  { opacity: 0, transform: 'translateX(72%)' }
]
function dealIn() {
  const step = reduce ? 0 : 55
  cards.forEach((c, i) => {
    c.el.style.transition = 'none'
    c.el.classList.add('in')
    c.el.animate(DEAL_KF, { duration: reduce ? 120 : 620, delay: i * step, easing: 'cubic-bezier(.22,1,.36,1)', fill: 'backwards' })
    const inner = c.el.querySelector('.inner')
    inner.style.transition = 'none'
    inner.animate(FLIP_KF, {
      duration: reduce ? 100 : 240,
      delay: i * step + (reduce ? 40 : 500),
      easing: 'cubic-bezier(.34,1.42,.64,1)',
      fill: 'forwards'
    })
    if (LOCK.has(c.r) || RARE.has(c.r)) {
      const gl = c.el.querySelector('.sheen')
      if (gl) gl.animate(SHEEN_KF, {
        duration: 520, delay: i * step + (reduce ? 60 : 760), easing: 'cubic-bezier(.32,.72,0,1)', fill: 'forwards'
      })
    }
  })
  setTimeout(() => Sound.deal(), (reduce ? 0 : 11 * step) + 520)
  setStage(1)
  el.act.textContent = '开始生成'
  el.act.dataset.primary = '1'
  el.act.dataset.hidden = '0'
  el.line.classList.add('locked'); el.line.blur()
}

/* =============== 7. 连击 =============== */
let comboTimer = 0
function bump() {
  S.combo = Math.min(S.combo + 1, 99)
  el.hudC.textContent = '×' + S.combo
  el.mult.textContent = '×' + S.combo
  el.mult.classList.remove('live'); void el.mult.offsetWidth; el.mult.classList.add('live')
  el.plus.classList.remove('go'); void el.plus.offsetWidth; el.plus.classList.add('go')
  clearTimeout(comboTimer)
  comboTimer = setTimeout(() => { S.combo = 0; el.hudC.textContent = '×1' }, 1600)
  if (S.combo >= 2) Sound.combo(S.combo)
}

/* =============== 8. 主流程 =============== */
function resetAll() {
  S.active = -1; S.combo = 0; S.busy = false; S.phase = null
  clearTimeout(comboTimer); clearTimeout(pulseTimer); clearTimeout(S.cue); clearTimeout(premTimer)
  el.plus.classList.remove('go')
  el.mult.classList.remove('live')
  el.act.textContent = '生成大纲'; el.act.dataset.primary = '1'; el.act.dataset.hidden = '0'
  el.line.classList.remove('locked')
  buildCards(); buildStage()
  el.casting.classList.remove('on')
  el.stagewrap.classList.remove('on'); el.arcwrap.classList.remove('on')
  el.arc.classList.remove('on'); el.arcveil.classList.remove('on')
  el.door.classList.remove('on', 'err'); el.burst.classList.remove('on')
  el.hud.classList.remove('on')
  el.prembtn.classList.remove('on'); el.premback.classList.remove('on')
  resetPulse()
  el.prem.classList.remove('on')
  el.hudN.textContent = '0/9'; el.hudC.textContent = '×1'

  el.line.focus()
}

function startDeal() {
  el.act.dataset.hidden = '1'
  el.seed.classList.remove('on')
  pulseAt(0, 0)
  setTimeout(() => pulseAt(1, 620, 900), 220)
  setTimeout(dealIn, 640)
}

function startCast() {
  el.deal.classList.remove('on')
  setStage(2)
  el.act.dataset.hidden = '1'
  pulseAt(2, 260)
  let i = 0
  const step = () => {
    if (S.stage !== 2) return
    showRig(i)
    playEnter(nodes[i])
    el.ping.classList.remove('go'); void el.ping.offsetWidth; el.ping.classList.add('go')
    /* Pulse 跟着真实进度连续推进：2（写作）→ 5（检查） */
    pulseAt(2 + 3 * ((i + 1) / N), reduce ? 120 : 480)
    Sound.land(); bump()
    i += 1
    if (i < N) S.cue = setTimeout(step, reduce ? 180 : 520)
    else S.cue = setTimeout(() => { if (S.stage === 2) gateError() }, reduce ? 220 : 680)
  }
  step()
}

/* 动作按钮：生成大纲 → 开始生成 → 重试 → 播放（弧线态另用 .prembtn） */
el.act.addEventListener('click', () => {
  clearTimeout(S.cue); clearTimeout(premTimer)
  if (S.stage === 0) return startDeal()
  if (S.stage === 1) return startCast()
  if (S.stage === 3 && S.phase === 'gate-error') return recast()
  if (S.stage === 3 && S.phase === 'gate-ok') return premiereFull()
})
el.line.addEventListener('focus', () => el.seed.classList.add('focus'))
el.line.addEventListener('blur', () => el.seed.classList.remove('focus'))
el.line.addEventListener('keydown', (e) => { if (e.key === 'Enter' && S.stage === 0) { e.preventDefault(); el.act.click() } })

/* 检查：error 卡住 + 火花 + 「重试」 */

  el.act.textContent = '重试'
  el.act.dataset.primary = '1'

}
function gatePass() {

}

/* =============== 9. 开演 =============== */
let premTimer = 0
const PREM_MS = 420
function premSlide(i) {
  const clone = nodes[i].inner.cloneNode(true)
  clone.style.transform = 'scale(1)'
  clone.querySelectorAll('.badge,.star').forEach((n) => n.remove())
  clone.querySelectorAll('.b[data-e]').forEach((n) => {
    const e = n.dataset.e

    n.style.animation = ENTER[e]
    n.style.animationDelay = (Number(n.dataset.d) || 0) + 'ms'
  })
  el.pslide.innerHTML = ''
  const wrap = document.createElement('div')
  wrap.style.cssText = 'position:absolute;inset:0;width:1600px;height:900px;will-change:transform,opacity,clip-path'
  wrap.appendChild(clone)
  el.pslide.appendChild(wrap)
  const tr = DECK[i].tr
  const KF = {
    fade: [{ opacity: 0 }, { opacity: 1 }],
    push: [{ transform: 'translate3d(100%,0,0)' }, { transform: 'translate3d(0,0,0)' }],
    wipe: [{ clipPath: 'inset(0 0 0 100%)' }, { clipPath: 'inset(0 0 0 0)' }],
    flip3d: [{ transform: 'rotateY(90deg)', opacity: .2 }, { transform: 'rotateY(0deg)', opacity: 1 }]
  }[tr] || [{ opacity: 0 }, { opacity: 1 }]
  wrap.animate(KF, { duration: reduce ? 120 : PREM_MS, easing: 'cubic-bezier(.32,.72,0,1)', fill: 'both' })
}
function premiereFull() {

}
function premiereStop() {

}

el.prembtn.addEventListener('click', premiereFull)
el.premback.addEventListener('click', () => { location.href = 'portal.html' })

/* =============== 10. 五段直接跳转（演示用） =============== */
function jump(n) {
  clearTimeout(S.cue); clearTimeout(premTimer)
  el.prem.classList.remove('on')
  el.act.dataset.hidden = '0'
  el.line.classList.add('locked')
  el.seed.classList.remove('on')
  el.prembtn.classList.remove('on'); el.premback.classList.remove('on')
  if (n === 0) { resetAll(); return }

  /* 大纲态 */
  el.stagewrap.classList.remove('on'); el.arcwrap.classList.remove('on')
  el.deal.classList.add('on')
  cards.forEach((c) => { c.el.style.transitionDelay = '0ms'; c.el.classList.add('in', 'flip') })
  if (n === 1) {
    setStage(1)
    el.act.textContent = '开始生成'; el.act.dataset.primary = '1'
    el.hud.classList.remove('on')
    resetPulse(); pulseAt(1.2, 600, 1400)
    return
  }
  el.deal.classList.remove('on')

  if (n === 2) {
    /* 生成中：中心幕冻结在 t≈170ms 的中间态 + 左侧 5 张已完成栈 + 右侧并发幕 */
    setStage(2)
    S.combo = 3
    S.active = 5
    showRig(5)
    el.hudC.textContent = '×3'
    playEnter(nodes[5], 170)
    el.ping.classList.remove('go'); void el.ping.offsetWidth; el.ping.classList.add('go')
    resetPulse(); pulseAt(3.8, 520, 1600)
    el.act.textContent = '开始生成'
    el.act.dataset.hidden = '1'
    return
  }

  if (n === 3) {
    /* 检查：error 态，门变红，8 束放射短线 */
    setStage(3)
    S.phase = 'gate-error'
    showGate(5, true)
    el.burst.classList.add('on')
    resetPulse(); pulseAt(5.6, 420)
    markBad()
    el.act.textContent = '重试'
    el.act.dataset.primary = '1'
    el.act.dataset.hidden = '0'
    return
  }

  /* 播放：9 张排成弧线 + 中央「播放」 */
  setStage(4)
  S.phase = 'gate-ok'
  showArc()
  resetPulse(); pulseAt(6.6, 380)
}

/* 一键自动播完整流程 */
let abort = false
async function autoplay() {
  if (S.busy) { abort = true; return }
  S.busy = true; abort = false
  el.auto.dataset.on = '1'
  const wait = async (ms) => { await sleep(ms); if (abort) throw new Error('stop') }
  try {
    resetAll()
    await wait(340)
    pulseAt(0, 0)
    await wait(520)
    startDeal()
    await wait(reduce ? 700 : 1900)
    startCast()
    await wait(reduce ? 2400 : 5600)
    await wait(900)
    recast()
    await wait(reduce ? 900 : 1700)
    premiereFull()
    await wait(reduce ? 5200 : 8000)
    premiereStop()
    await wait(300)
  } catch (_) { /* 被打断：交给用户 */ }
  finally { S.busy = false; el.auto.dataset.on = '0' }
}
el.auto.addEventListener('click', () => { abort = true; setTimeout(autoplay, 30) })

addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return
  if (el.prem.classList.contains('on')) premiereStop()
  else if (S.stage !== 0) resetAll()
})

/* =============== 11. 初始化（读门户页写入的偏好） =============== */
const PREF_KEY = 'lumen.prefs'
function readPrefs() {
  try { return JSON.parse(localStorage.getItem(PREF_KEY) || '{}') } catch (_) { return {} }
}
function savePref(k, v) {
  try {
    const p = readPrefs(); p[k] = v
    localStorage.setItem(PREF_KEY, JSON.stringify(p))
  } catch (_) {}
}
const prefs = readPrefs()
const startTier = String(prefs.tier || 'L3').toLowerCase()
if (['l3', 'l1', 'l0'].includes(startTier)) {
  document.documentElement.dataset.forgeTier = startTier
  el.tier.dataset.t = startTier
  el.tier.textContent = startTier.toUpperCase()
}
if (prefs.audio === true) {
  Sound.on = true
  el.snd.dataset.on = '1'
  el.snd.querySelector('.wave1').setAttribute('opacity', '1')
}
resetAll()
if (reduce) {
  document.documentElement.dataset.forgeTier = 'l1'
  el.tier.dataset.t = 'l1'; el.tier.textContent = 'L1'
}
})()
</script>
</body>
</html>
