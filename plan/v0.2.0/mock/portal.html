<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>LUMEN · 幕光</title>
<!--
  plan/v0.2.0/mock/portal.html —— 门户页样张（零依赖、无外部请求、双击即开）
  · 不是产品代码：只验证门户的版式、入口与设置联动
  · 与 forge.html 通过 localStorage（lumen.prefs）联动：性能档 / 音效 / 减少动效
  · 文字元素（首屏）：品牌 / 版本 / 主标题 / 副标题 / 进入工作台 / 设置 = 6
-->
<style>
:root{
  color-scheme:dark;
  --ui-bg:#0a0b0e; --ui-bg-2:#0e1014; --ui-panel:#12141a; --ui-panel-2:#171a21;
  --ui-elev:#1c2029; --ui-hover:#222732; --ui-line:#23262f; --ui-line-strong:#343948;
  --ui-fg:#e8eaef; --ui-fg-dim:#a4aab8; --ui-fg-mute:#737a8a;
  --ui-accent:#c8a15a; --ui-accent-2:#57e3c2;
  --ui-accent-soft:rgba(200,161,90,.14); --ui-accent-line:rgba(200,161,90,.34);
  --ui-danger:#e4574f;
  --ui-font:system-ui,-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif;
  --ui-font-mono:ui-monospace,'SF Mono','Cascadia Mono',Consolas,monospace;
  --ease:cubic-bezier(.32,.72,0,1);
  --fx-t1:120ms; --fx-t2:220ms; --fx-t3:320ms; --fx-t4:520ms;
  --fx-ease:var(--ease);
  --fx-ease-settle:cubic-bezier(.22,1,.36,1);
  --fx-ease-pop:cubic-bezier(.34,1.42,.64,1);
  --fx-shadow:0 40px 120px rgba(0,0,0,.62);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:#07080b;color:var(--ui-fg);font-family:var(--ui-font);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font-family:inherit;border:0;background:none;color:inherit;cursor:pointer}
.viewport{position:fixed;inset:0;display:grid;place-items:center}
.frame{
  position:relative;width:1600px;height:900px;flex:0 0 auto;overflow:hidden;overflow:clip;isolation:isolate;
  transform:scale(var(--s,1));transform-origin:center center;background:var(--ui-bg);
}

/* ---------------------------------- 背景 ---------------------------------- */
.bg{
  position:absolute;inset:0;
  background:
    radial-gradient(70% 52% at 24% 18%, rgba(200,161,90,.14), transparent 62%),
    radial-gradient(60% 48% at 86% 88%, rgba(87,227,194,.08), transparent 64%),
    linear-gradient(180deg,#0a0b0e,#08090c 58%,#0b0c11);
}
.vignette{position:absolute;inset:0;background:radial-gradient(78% 66% at 42% 42%,transparent 42%,rgba(0,0,0,.6) 100%)}
.floorwrap{position:absolute;inset:0;perspective:900px;perspective-origin:50% 60%;pointer-events:none}
.floor{
  position:absolute;left:50%;bottom:-30%;width:3000px;height:1200px;margin-left:-1500px;
  transform:rotateX(76deg);transform-origin:50% 100%;
  background-image:
    linear-gradient(rgba(200,161,90,.075) 1px,transparent 1px),
    linear-gradient(90deg,rgba(200,161,90,.075) 1px,transparent 1px);
  background-size:150px 150px;
  -webkit-mask-image:radial-gradient(54% 60% at 50% 96%,#000 8%,transparent 72%);
  mask-image:radial-gradient(54% 60% at 50% 96%,#000 8%,transparent 72%);
  opacity:.55;
}

/* ---------------------------------- 顶栏 ---------------------------------- */
.top{position:absolute;left:88px;right:88px;top:52px;display:flex;align-items:center;justify-content:space-between;z-index:30}
.brand{display:flex;align-items:baseline;gap:12px;font-size:13px;letter-spacing:.34em;color:rgba(232,234,239,.5)}
.brand b{color:var(--ui-accent);font-weight:500}
.brand span{font-size:12px;letter-spacing:.28em;color:var(--ui-fg-mute)}
.meta{display:flex;align-items:center;gap:18px}
.ver{font-family:var(--ui-font-mono);font-size:11px;letter-spacing:.12em;color:var(--ui-fg-mute)}
.ghost{
  height:32px;padding:0 16px;border-radius:16px;border:1px solid var(--ui-line);
  font-size:12.5px;letter-spacing:.2em;text-indent:.2em;color:var(--ui-fg-dim);
  transition:color var(--fx-t2) var(--fx-ease),border-color var(--fx-t2) var(--fx-ease),background var(--fx-t2) var(--fx-ease);
}
.ghost:hover{color:var(--ui-fg);border-color:var(--ui-line-strong);background:rgba(34,39,50,.55)}

/* ---------------------------------- 主区 ---------------------------------- */
.main{position:absolute;inset:0;display:flex;align-items:center;z-index:20}
.hero{position:absolute;left:88px;top:300px;width:740px}
.hero h1{
  margin:0;font-size:56px;line-height:1.18;font-weight:600;letter-spacing:-.02em;
  color:var(--ui-fg);text-wrap:balance;
}
.hero h1 em{font-style:normal;color:var(--ui-accent)}
.hero p{margin:22px 0 0;font-size:15px;line-height:1.7;color:var(--ui-fg-mute);letter-spacing:.02em}
.enter{
  margin-top:40px;height:52px;padding:0 38px;border-radius:26px;
  background:var(--ui-accent);color:#0b0c10;font-size:14.5px;font-weight:600;letter-spacing:.26em;text-indent:.26em;
  box-shadow:0 18px 54px rgba(200,161,90,.24);
  transition:transform var(--fx-t2) var(--fx-ease-pop),box-shadow var(--fx-t2) var(--fx-ease),background var(--fx-t2) var(--fx-ease);
  display:inline-flex;align-items:center;gap:12px;
}
.enter:hover{transform:translateY(-2px);box-shadow:0 24px 64px rgba(200,161,90,.34);background:#d3aa61}
.enter:active{transform:translateY(0) scale(.99)}
.enter svg{transition:transform var(--fx-t2) var(--fx-ease)}
.enter:hover svg{transform:translateX(4px)}

/* 右侧：三张幕的扇形 */
.fan{
  position:absolute;right:104px;top:186px;width:760px;height:540px;
  perspective:1700px;perspective-origin:50% 50%;transform-style:preserve-3d;
}
.fan::before{
  content:"";position:absolute;left:50%;top:52%;width:760px;height:520px;margin:-260px 0 0 -380px;
  background:radial-gradient(50% 50% at 50% 50%,rgba(200,161,90,.12),transparent 70%);
  filter:blur(18px);pointer-events:none;
}
.deck{
  position:absolute;left:50%;top:50%;width:420px;height:236px;margin:-118px 0 0 -210px;
  border-radius:14px;overflow:hidden;background:#12141a;border:1px solid var(--ui-line);
  box-shadow:var(--fx-shadow);
  transform:translate3d(var(--x,0),var(--y,0),var(--z,0)) rotateY(var(--ry,0)) rotateX(var(--rx,0)) scale(var(--sc,1));
  transform-style:preserve-3d;will-change:transform;
  transition:transform var(--fx-t4) var(--fx-ease-settle),box-shadow var(--fx-t3) var(--fx-ease),border-color var(--fx-t3) var(--fx-ease);
  cursor:pointer;
  animation:float 9s ease-in-out infinite;
  animation-delay:var(--d,0s);
}
.deck:hover{
  transform:translate3d(var(--hx,0),calc(var(--y,0px) - 10px),calc(var(--z,0px) + 60px)) rotateY(0deg) rotateX(0deg) scale(1.03);
  border-color:var(--ui-accent-line);box-shadow:0 50px 120px rgba(0,0,0,.7),0 0 90px rgba(200,161,90,.14);
}
@keyframes float{0%,100%{translate:0 0}50%{translate:0 -10px}}
.deck .art{position:absolute;inset:0}
.deck .b{position:absolute;border-radius:4px}
.deck .k-h{background:linear-gradient(90deg,#dfe3ea,#aeb4c1)}
.deck .k-t{background:#343b4b}
.deck .k-r{background:var(--ui-accent);border-radius:2px}
.deck .k-p{background:rgba(255,255,255,.028);border:1px solid #23262f;border-radius:10px}
.deck .k-o{background:conic-gradient(from -90deg,var(--ui-accent) 0 26%,var(--ui-accent-2) 26% 56%,#39404f 56% 100%);border-radius:50%;
  -webkit-mask:radial-gradient(circle,transparent 58%,#000 60%);mask:radial-gradient(circle,transparent 58%,#000 60%)}
.deck .glare{
  position:absolute;inset:0;pointer-events:none;opacity:0;
  background:linear-gradient(112deg,transparent 40%,rgba(255,255,255,.10) 50%,transparent 60%);
  transition:opacity var(--fx-t3) var(--fx-ease);
}
.deck:hover .glare{opacity:1}

/* ---------------------------------- 设置抽屉 ---------------------------------- */
.scrim{
  position:absolute;inset:0;z-index:50;background:rgba(4,5,7,.62);backdrop-filter:blur(3px);
  opacity:0;pointer-events:none;transition:opacity var(--fx-t3) var(--fx-ease);
}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{
  position:absolute;top:0;right:0;bottom:0;width:472px;z-index:60;
  background:linear-gradient(180deg,#101218,#0c0e13);
  border-left:1px solid var(--ui-line);box-shadow:-40px 0 120px rgba(0,0,0,.6);
  transform:translateX(100%);transition:transform var(--fx-t3) var(--fx-ease-settle);
  display:flex;flex-direction:column;
}
.drawer.on{transform:translateX(0)}
.drawer header{display:flex;align-items:center;justify-content:space-between;padding:28px 32px 18px}
.drawer h2{margin:0;font-size:15px;letter-spacing:.28em;font-weight:500;color:var(--ui-fg)}
.x{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--ui-fg-mute);transition:color var(--fx-t2) var(--fx-ease),background var(--fx-t2) var(--fx-ease)}
.x:hover{color:var(--ui-fg);background:rgba(34,39,50,.6)}
.drawer .body{flex:1 1 auto;overflow:auto;padding:4px 32px 28px;display:flex;flex-direction:column;gap:26px}
.row{display:flex;flex-direction:column;gap:10px}
.row .lab{display:flex;align-items:baseline;justify-content:space-between;font-size:12px;letter-spacing:.16em;color:var(--ui-fg-mute)}
.row .hint{font-size:11px;letter-spacing:0;color:var(--ui-fg-mute);opacity:.7}
.seg{display:flex;gap:4px;padding:4px;border-radius:10px;background:rgba(255,255,255,.03);border:1px solid var(--ui-line)}
.seg button{
  flex:1 1 0;height:32px;border-radius:7px;font-size:12px;letter-spacing:.06em;color:var(--ui-fg-dim);
  transition:background var(--fx-t2) var(--fx-ease),color var(--fx-t2) var(--fx-ease),box-shadow var(--fx-t2) var(--fx-ease);
  white-space:nowrap;
}
.seg button:hover{color:var(--ui-fg)}
.seg button[data-on="1"]{background:var(--ui-accent-soft);color:var(--ui-accent);box-shadow:inset 0 0 0 1px var(--ui-accent-line)}
.switch{
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:12px 14px;border-radius:10px;border:1px solid var(--ui-line);background:rgba(255,255,255,.02);
}
.switch .t{font-size:12.5px;letter-spacing:.08em;color:var(--ui-fg-dim)}
.knob{width:40px;height:22px;border-radius:11px;background:var(--ui-line-strong);position:relative;transition:background var(--fx-t2) var(--fx-ease)}
.knob::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#e8eaef;transition:transform var(--fx-t2) var(--fx-ease-pop),background var(--fx-t2) var(--fx-ease)}
.knob[data-on="1"]{background:var(--ui-accent-line)}
.knob[data-on="1"]::after{transform:translateX(18px);background:var(--ui-accent)}
.keys{display:flex;flex-direction:column;gap:8px}
.keys div{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--ui-fg-mute)}
kbd{
  font-family:var(--ui-font-mono);font-size:11px;padding:3px 7px;border-radius:5px;
  border:1px solid var(--ui-line-strong);background:var(--ui-panel-2);color:var(--ui-fg-dim);
}
.drawer footer{padding:18px 32px 26px;border-top:1px solid var(--ui-line);font-family:var(--ui-font-mono);font-size:11px;letter-spacing:.08em;color:var(--ui-fg-mute)}

/* 焦点 */
:focus-visible{outline:2px solid var(--ui-accent);outline-offset:3px;border-radius:8px}

@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition-duration:120ms!important}
}
</style>
</head>
<body>
<div class="viewport">
  <div class="frame" id="frame">
    <div class="bg"></div>
    <div class="floorwrap"><div class="floor"></div></div>
    <div class="vignette"></div>

    <div class="top">
      <div class="brand">LUMEN <b>/</b> <span>幕光</span></div>
      <div class="meta">
        <span class="ver">v0.2.0</span>
        <button class="ghost" id="btnSet" aria-haspopup="dialog">设置</button>
      </div>
    </div>

    <div class="main">
      <div class="hero">
        <h1>把一句话，<br>变成一套<em>能演</em>的演示。</h1>
        <p>生成、排版、检查、播放，在同一张台面上完成。</p>
        <button class="enter" id="btnEnter">
          进入工作台
          <svg width="16" height="10" viewBox="0 0 16 10" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
            <path d="M1 5h13M10 1l4 4-4 4"/>
          </svg>
        </button>
      </div>

      <div class="fan" id="fan" aria-hidden="true"></div>
    </div>

    <div class="scrim" id="scrim"></div>
    <aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-label="设置">
      <header>
        <h2>设置</h2>
        <button class="x" id="btnClose" aria-label="关闭">
          <svg width="12" height="12" viewBox="0 0 12 12" stroke="currentColor" stroke-width="1.3"><path d="M1 1l10 10M11 1L1 11"/></svg>
        </button>
      </header>
      <div class="body">
        <div class="row">
          <div class="lab"><span>通道</span><span class="hint">决定生成走哪里</span></div>
          <div class="seg" id="segChannel">
            <button data-v="mock" data-on="1">示例</button>
            <button data-v="live">真模型</button>
            <button data-v="replay">回放</button>
          </div>
        </div>
        <div class="row">
          <div class="lab"><span>模型</span><span class="hint">真模型时生效</span></div>
          <div class="seg" id="segModel">
            <button data-v="deepseek" data-on="1">DeepSeek</button>
            <button data-v="openai">OpenAI</button>
            <button data-v="ollama">Ollama</button>
          </div>
        </div>
        <div class="row">
          <div class="lab"><span>台面档位</span><span class="hint">低端机自动降档</span></div>
          <div class="seg" id="segTier">
            <button data-v="L3" data-on="1">L3 3D</button>
            <button data-v="L1">L1 平面</button>
            <button data-v="L0">L0 静态</button>
          </div>
        </div>
        <div class="row">
          <div class="lab"><span>声音</span></div>
          <div class="switch"><span class="t">落位与连击的轻音</span><button class="knob" id="swAudio" data-on="0" aria-pressed="false"></button></div>
          <div class="switch"><span class="t">减少动效</span><button class="knob" id="swReduce" data-on="0" aria-pressed="false"></button></div>
        </div>
        <div class="row">
          <div class="lab"><span>语言</span></div>
          <div class="seg" id="segLang">
            <button data-v="zh" data-on="1">中文</button>
            <button data-v="en">English</button>
          </div>
        </div>
        <div class="row">
          <div class="lab"><span>快捷键</span></div>
          <div class="keys">
            <div><span>进入工作台</span><kbd>Enter</kbd></div>
            <div><span>设置</span><kbd>⌘ ,</kbd></div>
            <div><span>关闭面板</span><kbd>Esc</kbd></div>
          </div>
        </div>
      </div>
      <footer>v0.2.0 · 本地存储 · 无后端 · 无遥测</footer>
    </aside>
  </div>
</div>

<script>
(() => {
'use strict'
const $ = (id) => document.getElementById(id)
const frame = $('frame')
const fit = () => frame.style.setProperty('--s', Math.min(innerWidth / 1600, innerHeight / 900).toFixed(4))
addEventListener('resize', fit); fit()

/* 偏好：与 forge.html 共用同一份 localStorage */
const KEY = 'lumen.prefs'
const DEFAULTS = { channel: 'mock', model: 'deepseek', tier: 'L3', audio: false, reduce: false, lang: 'zh' }
const load = () => { try { return Object.assign({}, DEFAULTS, JSON.parse(localStorage.getItem(KEY) || '{}')) } catch (_) { return { ...DEFAULTS } } }
const save = (p) => { try { localStorage.setItem(KEY, JSON.stringify(p)) } catch (_) {} }
let prefs = load()

/* ---------------- 三张幕的扇形（纯骨架，无文字） ---------------- */
const DECKS = [
  { ry: 16, x: -290, y: 20, z: -110, sc: .9, d: '.4s', hx: -290,
    art: [[34,30,150,12],[34,52,90,3],[34,74,220,7],[34,92,180,7],[264,30,122,150,'p'],[276,44,88,6],[276,60,64,6]] },
  { ry: 0, x: 0, y: -6, z: 40, sc: 1.02, d: '0s', hx: 0,
    art: [[30,42,228,26],[30,82,72,3],[30,110,290,7],[30,126,252,7],[30,142,204,7]] },
  { ry: -16, x: 290, y: 24, z: -110, sc: .9, d: '.9s', hx: 290,
    art: [[28,28,110,8],[28,48,60,2],[28,66,104,54,'p'],[144,66,104,54,'p'],[260,66,104,54,'p'],[28,140,190,6]] }
]
function buildFan() {
  const host = $('fan')
  host.innerHTML = ''
  DECKS.forEach((d) => {
    const el = document.createElement('div')
    el.className = 'deck'
    el.style.setProperty('--x', d.x + 'px')
    el.style.setProperty('--y', d.y + 'px')
    el.style.setProperty('--z', d.z + 'px')
    el.style.setProperty('--ry', d.ry + 'deg')
    el.style.setProperty('--sc', d.sc)
    el.style.setProperty('--d', d.d)
    el.style.setProperty('--hx', d.hx + 'px')
    const art = document.createElement('div')
    art.className = 'art'
    for (const b of d.art) {
      const n = document.createElement('div')
      const kind = b[4] === 'p' ? 'k-p' : (b[3] >= 20 ? 'k-h' : b[3] >= 5 ? 'k-t' : 'k-r')
      n.className = 'b ' + kind
      n.style.cssText = `left:${b[0]}px;top:${b[1]}px;width:${b[2]}px;height:${b[3]}px`
      art.appendChild(n)
    }
    const glare = document.createElement('div'); glare.className = 'glare'
    el.appendChild(art); el.appendChild(glare)
    el.addEventListener('click', go)
    host.appendChild(el)
  })
}

/* ---------------- 进入工作台：带一次收拢转场 ---------------- */
let leaving = false
function go() {
  if (leaving) return
  leaving = true
  document.querySelectorAll('.deck').forEach((el, i) => {
    el.animate(
      [{ transform: getComputedStyle(el).transform }, { transform: 'translate3d(0,0,0) scale(.86)', opacity: 0 }],
      { duration: 420, delay: i * 40, easing: 'cubic-bezier(.4,0,1,1)', fill: 'forwards' }
    )
  })
  const hero = document.querySelector('.hero')
  if (hero) hero.animate([{ opacity: 1, transform: 'translateY(0)' }, { opacity: 0, transform: 'translateY(-8px)' }],
    { duration: 260, easing: 'cubic-bezier(.4,0,1,1)', fill: 'forwards' })
  frame.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 240, delay: 260, easing: 'linear', fill: 'forwards' })
  setTimeout(() => { location.href = 'forge.html' }, 560)
}

/* ---------------- 设置抽屉 ---------------- */
const drawer = $('drawer')
const scrim = $('scrim')
function openSet() {
  drawer.classList.add('on'); scrim.classList.add('on')
  $('btnClose').focus()
}
function closeSet() {
  drawer.classList.remove('on'); scrim.classList.remove('on')
  $('btnSet').focus()
}
$('btnSet').addEventListener('click', openSet)
$('btnClose').addEventListener('click', closeSet)
scrim.addEventListener('click', closeSet)

function paintSeg(host, value) {
  host.querySelectorAll('button').forEach((b) => { b.dataset.on = b.dataset.v === value ? '1' : '0' })
}
function paintKnob(el, on) {
  el.dataset.on = on ? '1' : '0'
  el.setAttribute('aria-pressed', on ? 'true' : 'false')
}
document.querySelectorAll('.seg').forEach((seg) => {
  seg.addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return
    const key = { segChannel: 'channel', segModel: 'model', segTier: 'tier', segLang: 'lang' }[seg.id]
    prefs[key] = b.dataset.v
    paintSeg(seg, b.dataset.v)
    save(prefs)
  })
})
$('swAudio').addEventListener('click', () => { prefs.audio = !prefs.audio; paintKnob($('swAudio'), prefs.audio); save(prefs) })
$('swReduce').addEventListener('click', () => { prefs.reduce = !prefs.reduce; paintKnob($('swReduce'), prefs.reduce); save(prefs) })

function hydrate() {
  paintSeg($('segChannel'), prefs.channel)
  paintSeg($('segModel'), prefs.model)
  paintSeg($('segTier'), prefs.tier)
  paintSeg($('segLang'), prefs.lang)
  paintKnob($('swAudio'), prefs.audio)
  paintKnob($('swReduce'), prefs.reduce)
}

$('btnEnter').addEventListener('click', go)
addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !drawer.classList.contains('on')) { e.preventDefault(); go() }
  if (e.key === 'Escape' && drawer.classList.contains('on')) closeSet()
  if ((e.metaKey || e.ctrlKey) && e.key === ',') { e.preventDefault(); drawer.classList.contains('on') ? closeSet() : openSet() }
})

buildFan()
hydrate()
})()
</script>
</body>
</html>
